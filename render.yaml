# Render blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lead-pipeline-optout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
        # Create a free Neon Postgres and paste the connection string here.
        # Render free tier also has a free Postgres you can use instead.
      - key: PYTHON_VERSION
        value: 3.12.0
